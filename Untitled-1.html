<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer in Sri Lanka</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
}

/* Barra superior */
.top-bar {
    height: 48px;
    width: 100%;
    background: #000;
    position: relative;
}

.top-bar::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    width: 5px;
    height: 5px;
    background: red;
    border-radius: 50%;
}

/* Contenedor principal */
.container {
    display: flex;
    width: 100%;
    height: calc(100vh - 48px);
    min-height: 500px;
    border-radius: 10px 10px 0 0;
    overflow: hidden;
}

/* Imagen izquierda */
.left-section {
    width: 37.5%;
    position: relative;
    overflow: hidden;
    background: #222;
}

.left-section img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

/* Barra lateral negra */
.side-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 80px;
    height: 100%;
    background: rgba(0,0,0,0.85);
    border-right: 1px dashed #c5dcff;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
}

.circle {
    width: 26px;
    height: 26px;
    background: #c5dcff;
    border-radius: 50%;
}

/* Sección derecha */
.right-section {
    width: 62.5%;
    background: #c5dcff;
    color: #0054d8;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 35px;
}

/* Contenido central */
.content {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: -15px;
}

/* Ilustración */
.train-drawing {
    width: 170px;
    height: 150px;
    margin-bottom: 18px;
}

.train-drawing svg {
    width: 100%;
    height: 100%;
}

/* Título */
h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(45px, 6.2vw, 84px);
    line-height: 0.88;
    letter-spacing: -5px;
    font-weight: 900;
    text-transform: none;
    margin-bottom: 25px;
}

.subtitle {
    font-size: clamp(16px, 2.1vw, 26px);
    font-weight: 500;
    letter-spacing: -0.8px;
}

/* Información inferior */
.footer {
    position: absolute;
    bottom: 22px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    white-space: nowrap;
    gap: 12px;
    overflow: hidden;
    font-size: 16px;
    font-weight: 500;
}

.footer-item {
    display: flex;
    align-items: center;
    gap: 9px;
}

.globe {
    font-size: 17px;
}

/* Responsive */
@media (max-width: 700px) {
    body {
        overflow: auto;
    }

    .container {
        height: auto;
        min-height: 100vh;
        flex-direction: column;
    }

    .left-section {
        width: 100%;
        height: 40vh;
    }

    .right-section {
        width: 100%;
        min-height: 60vh;
        padding: 30px 15px 85px;
    }

    h1 {
        font-size: 52px;
        letter-spacing: -3px;
    }

    .train-drawing {
        width: 120px;
        height: 110px;
    }

    .footer {
        font-size: 11px;
        bottom: 12px;
    }

    .side-bar {
        width: 50px;
    }
}
</style>
</head>

<body>

<div class="top-bar"></div>

<main class="container">

    <!-- IMAGEN IZQUIERDA -->
    <section class="left-section">

        <img src="train-sri-lanka.jpg"
             alt="Tren viajando por Sri Lanka">

        <div class="side-bar">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>

    </section>

    <!-- DISEÑO DERECHO -->
    <section class="right-section">

        <div class="content">

            <!-- ILUSTRACIÓN DEL TREN -->
            <div class="train-drawing">
                <svg viewBox="0 0 180 150"
                     fill="none"
                     stroke="#0054d8"
                     stroke-width="2.5"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <!-- Palmeras -->
                    <path d="M35 115 Q38 80 54 40"/>
                    <path d="M54 40 Q25 25 23 14 Q43 17 55 30"/>
                    <path d="M54 40 Q65 10 83 9 Q73 30 54 40"/>
                    <path d="M54 40 Q46 10 58 2"/>
                    <path d="M54 40 Q20 40 14 55"/>

                    <path d="M125 90 Q132 55 151 26"/>
                    <path d="M151 26 Q126 12 130 3"/>
                    <path d="M151 26 Q166 4 175 12"/>
                    <path d="M151 26 Q178 32 174 45"/>

                    <!-- Humo -->
                    <path d="M72 78 Q90 62 79 49 Q68 38 83 29"/>
                    <path d="M88 67 Q104 51 95 38"/>

                    <!-- Tren -->
                    <path d="M65 99 L118 80 L142 89 L142 108 L66 125 Z"/>
                    <path d="M118 80 L118 68 L138 62 L142 89"/>
                    <path d="M65 99 L142 89"/>

                    <!-- Ventanas -->
                    <path d="M80 93 L82 107"/>
                    <path d="M96 88 L98 103"/>
                    <path d="M112 83 L114 98"/>
                    <path d="M126 79 L128 94"/>

                    <!-- Ruedas -->
                    <circle cx="80" cy="115" r="5"/>
                    <circle cx="103" cy="108" r="5"/>
                    <circle cx="128" cy="101" r="5"/>

                    <!-- Rieles -->
                    <path d="M34 137 L145 109"/>
                    <path d="M23 143 L36 133"/>
                    <path d="M44 139 L55 128"/>
                    <path d="M66 132 L76 122"/>
                    <path d="M89 126 L98 116"/>

                    <!-- Agua y detalles -->
                    <path d="M145 126 Q157 117 169 124"/>
                    <path d="M112 139 Q124 132 135 139"/>
                    <path d="M143 116 Q158 107 174 112"/>
                </svg>
            </div>

            <!-- TÍTULO -->
            <h1>
                Summer in<br>
                Sri Lanka
            </h1>

            <!-- SUBTÍTULO -->
            <p class="subtitle">
                A 10-Day Journey Across the Island State
            </p>

        </div>

        <!-- PIE DE PÁGINA -->
        <footer class="footer">

            <div class="footer-item">
                Sri Lanka
                <span class="globe">◎</span>
            </div>

            <div class="footer-item">
                14.2417° N
                <span class="globe">◎</span>
            </div>

            <div class="footer-item">
                40.3169° E
                <span class="globe">◎</span>
            </div>

            <div class="footer-item">
                July – August 2028
                <span class="globe">◎</span>
            </div>

            <div class="footer-item">
                Sri Lanka
            </div>

        </footer>

    </section>

</main>

</body>
</html>
